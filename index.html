<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>US County Health & Socioeconomic Indicators</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <h1>US County Health & Socioeconomic Visualization</h1>
      <div class="tagline">
        An interactive exploration of health and socioeconomic patterns
      </div>
    </header>

   

      <div id="controls">
        <div class="control-panel" id="histogram-controls">
          <label for="histogram-select"
            ><i class="fas fa-chart-bar"></i> Histogram:</label
          >
          <select id="histogram-select">
            <option value="poverty_perc">Poverty Percentage</option>
            <option value="percent_stroke">Stroke Prevalence</option>
            <option value="median_household_income">
              Median Household Income
            </option>
            <option value="percent_no_health_insurance">
              No Health Insurance (%)
            </option>
          </select>
        </div>

        <div class="control-panel" id="scatterplot-controls">
          <label for="x-axis-select"
            ><i class="fas fa-arrows-alt-h"></i> X-Axis:</label
          >
          <select id="x-axis-select">
            <option value="poverty_perc">Poverty Percentage</option>
            <option value="percent_stroke">Stroke Prevalence</option>
            <option value="median_household_income">
              Median Household Income
            </option>
            <option value="percent_no_health_insurance">
              No Health Insurance (%)
            </option>
          </select>
          <label for="y-axis-select"
            ><i class="fas fa-arrows-alt-v"></i> Y-Axis:</label
          >
          <select id="y-axis-select">
            <option value="median_household_income">
              Median Household Income
            </option>
            <option value="poverty_perc">Poverty Percentage</option>
            <option value="percent_stroke">Stroke Prevalence</option>
            <option value="percent_no_health_insurance">
              No Health Insurance (%)
            </option>
          </select>
        </div>

        <div class="control-panel" id="choropleth-controls">
          <label for="choropleth-select"
            ><i class="fas fa-map"></i> Map Variable:</label
          >
          <select id="choropleth-select">
            <option value="poverty_perc">Poverty Percentage</option>
            <option value="percent_stroke">Stroke Prevalence</option>
            <option value="median_household_income">
              Median Household Income
            </option>
            <option value="percent_no_health_insurance">
              No Health Insurance (%)
            </option>
          </select>
        </div>
      </div>
    </div>

    <div id="visualizations">
      <div class="viz-panel" id="histogram-panel">
        <div id="histogram" class="chart-container"></div>
      </div>
      <div class="viz-panel" id="scatterplot-panel">
        <div id="scatterplot" class="chart-container"></div>
      </div>
      <div class="viz-panel" id="choropleth-panel">
        <div id="choropleth" class="chart-container"></div>
        <div id="choropleth-legend"></div>
      </div>
    </div>

    
     

      

    <footer>
      <p>
        Interactive Data Visualization Project &copy; 2025 | Built with D3.js
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
